<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캐치캐치</title>
<meta name="description" content="캡처와 링크를 올리면 AI가 읽고 요약해 폴더에 정리해 주는 보관함">
<meta name="theme-color" content="#EBEBE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1D1F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캐치캐치">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 520px), fixed bottom bar with a pink "sphere" add button, bottom sheet for adding */
:root{
  --bg:#EBEBE9; --surface:#F7F7F5; --sunk:#DEDEDB; --ink:#2A2A2C; --mute:#5E5E62; --line:#D3D3D0;
  --pink:#EDBFC6; --on-pink:#2A2A2C; --mark:#F2CCD2; --danger:#A3303F; --scrim:rgba(30,30,32,.38);
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1D1D1F; --surface:#29292C; --sunk:#333336; --ink:#ECECEA; --mute:#A4A4A8; --line:#3B3B3F;
  --pink:#E6B1BA; --on-pink:#1D1D1F; --mark:#6B4148; --danger:#F08A97; --scrim:rgba(0,0,0,.55); color-scheme:dark}}

html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-inline:20px;padding-block:16px 130px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1}
.logo span{display:block;line-height:1;padding-top:2px}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:22px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn.bare{border-color:transparent}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
.headline{margin:6px 0 0;font-size:26px;line-height:1.32;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.headline b{font-weight:600}
.searchbar{display:flex;align-items:center;gap:10px;height:52px;width:100%;border:0;border-radius:26px;background:var(--surface);padding-inline:18px;color:var(--mute);cursor:pointer;text-align:left}
.searchbar svg{color:var(--ink)}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center}
.sec-head h2{margin:0;font-size:16px;font-weight:600}
.textbtn{background:none;border:0;color:var(--mute);font-size:13px;min-height:44px;padding:0 4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.textbtn.danger{color:var(--danger)}

.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcard{min-height:104px;border-radius:20px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;border:1px solid transparent;text-align:left;cursor:pointer}
.fcard.ai{background:transparent;border:1px dashed var(--mute)}
.fcard.add{background:transparent;border:1px solid var(--line);color:var(--mute);justify-content:center;align-items:center;flex-direction:row;gap:8px}
.fcard.form{grid-column:1/-1;cursor:default;background:var(--surface);min-height:0}
.badge{align-self:flex-start;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:10px;background:var(--pink);color:var(--on-pink);white-space:nowrap}
.badge.plain{background:var(--sunk);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--ink)}
.dot.pink{background:var(--pink)}
.fname{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.fcount{font-family:var(--mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.thumb{flex:0 0 60px;height:60px;border-radius:14px;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:13px;color:var(--mute);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rm{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:var(--mark);color:var(--ink);border-radius:4px;padding:0 2px}

.empty{background:var(--surface);border-radius:24px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty p{margin:0;color:var(--mute);font-size:14px}
.empty h3{margin:0;font-size:17px;font-weight:600}

.btn{height:52px;border-radius:26px;border:0;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn.pink{background:var(--pink);color:var(--on-pink)}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--bg)}
.btn.sm{height:44px;border-radius:22px;font-size:14px;padding:0 16px}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs{max-width:520px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.tab{width:64px;height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);cursor:pointer;font-size:11px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.addbtn{width:62px;height:62px;border-radius:31px;border:0;background:var(--pink);color:var(--on-pink);margin-top:-30px;box-shadow:0 0 0 6px var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}

.shot{border-radius:24px;background:var(--surface);overflow:hidden;display:flex;justify-content:center}
.shot img{display:block;width:100%;max-height:68vh;object-fit:contain}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:24px;background:var(--sunk)}
.seg button{height:40px;border-radius:20px;border:0;background:transparent;cursor:pointer;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);font-weight:600}
.dtitle{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.6}
.bul li{display:flex;gap:10px}
.bul li::before{content:"";flex:0 0 6px;height:6px;margin-top:9px;border-radius:3px;background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--surface);border:0;cursor:pointer;min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.raw{white-space:pre-wrap;background:var(--surface);border-radius:18px;padding:16px;font-size:14px;line-height:1.75;overflow-wrap:anywhere;margin:0;font-family:var(--sans)}
.meta{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);font-size:14px}
.mrow .v{font-family:var(--mono);font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.mrow a{color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0;text-decoration:none}
.mrow a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:0 12px;max-width:60%}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.confirm{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.confirm p{margin:0;font-size:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.05em}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;min-height:46px}
textarea.inp{resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--mute);margin:0}
.note{font-size:13px;padding:12px 14px;border-radius:14px;background:var(--sunk);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note.err{color:var(--danger)}
.card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:16px;font-weight:600}
.card p{margin:0;font-size:13px;color:var(--mute)}
.card a{color:var(--ink)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{width:100%;max-width:520px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.shead{display:flex;align-items:center;justify-content:space-between}
.shead h2{margin:0;font-size:17px;font-weight:600}
.drop{border:1.5px dashed var(--mute);border-radius:22px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--mute);font-size:14px}
.drop.over{background:var(--surface)}
.pv{display:flex;gap:14px;align-items:center}
.pv .thumb{flex-basis:76px;height:96px;border-radius:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;border-radius:18px;border:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.opt[aria-checked="true"]{border:1.5px solid var(--ink);background:var(--surface)}
.radio{flex:0 0 20px;height:20px;border-radius:10px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--ink)}
.obody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.oname{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.odesc{font-size:12px;color:var(--mute)}
.thinking{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0;text-align:center;color:var(--ink)}
.thinking p{margin:0;font-size:14px;color:var(--mute)}
.spin{animation:spin 2.4s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.answer{background:var(--surface);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.answer p{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap}
details summary{cursor:pointer;font-size:13px;color:var(--mute);min-height:36px;display:flex;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:30;max-width:calc(100% - 40px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="view" class="wrap" aria-live="polite"></div>

<nav class="tabbar" aria-label="메뉴">
  <div class="tabs">
    <button class="tab" data-act="go-home" id="tab-home" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H4 Z"/></svg>홈
    </button>
    <button class="addbtn" data-act="add" aria-label="캡처 올리기">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5 V19 M5 12 H19"/></svg>
    </button>
    <button class="tab" data-act="go-search" id="tab-search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16 L21 21"/></svg>검색
    </button>
  </div>
</nav>

<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="backup-file" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (p, n=22) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  back:'<path d="M15 5 L8 12 L15 19"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16 L21 21"/>',
  link:'<path d="M10 14 L14 10"/><path d="M8.5 11.5 L6.5 13.5 a3.5 3.5 0 0 0 5 5 L13.5 16.5"/><path d="M15.5 12.5 L17.5 10.5 a3.5 3.5 0 0 0 -5 -5 L10.5 7.5"/>',
  down:'<path d="M12 4 V15 M8 11 L12 15 L16 11 M5 19 H19"/>',
  up:'<path d="M12 15 V4 M8 8 L12 4 L16 8 M5 19 H19"/>',
  trash:'<path d="M5 7 H19 M10 7 V4.5 H14 V7 M7 7 L8 20 H16 L17 7"/>',
  edit:'<path d="M4 20 H8 L19 9 L15 5 L4 16 Z"/>',
  close:'<path d="M6 6 L18 18 M18 6 L6 18"/>',
  image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M20 16 L15 11 L6 19"/>',
  plus:'<path d="M12 5 V19 M5 12 H19"/>',
  spark:'<path d="M12 3 L13.6 9.4 L20 11 L13.6 12.6 L12 19 L10.4 12.6 L4 11 L10.4 9.4 Z"/>',
  stop:'<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3 V5.5 M12 18.5 V21 M3 12 H5.5 M18.5 12 H21 M5.6 5.6 L7.4 7.4 M16.6 16.6 L18.4 18.4 M5.6 18.4 L7.4 16.6 M16.6 7.4 L18.4 5.6"/>'
};
/* 캐치캐치 logo: one continuous line drawing of a hand pinching the pink sphere */
const HAND = 'M8 44 C 9 36, 10 29, 14 22 C 16 18.5, 20 16, 25.5 15.2 C 28 14.9, 28.6 18.3, 26.4 18.9 C 23.5 19.6, 20.5 20.6, 18.5 22.5 C 17.3 23.7, 17.6 25.5, 19 25.6 C 21.5 25.7, 23.5 25.3, 26 25.6 C 28.4 25.9, 28.2 29.3, 25.6 29.6 C 21 30.2, 17 33.5, 15.5 37 C 14.8 39, 14.6 41.5, 14.8 44';
const LOGO = (w=32,h=30) => `<svg width="${w}" height="${h}" viewBox="6 13 35 33" style="display:block;flex:0 0 auto" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="33.2" cy="22.4" r="6.6" style="fill:var(--pink);stroke:none"/><path d="${HAND}"/></svg>`;
const SPIN = n => `<svg width="${n}" height="${n}" viewBox="0 0 40 40" aria-hidden="true"><g class="spin"><path d="M20 3 A17 17 0 0 1 20 37" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M20 10 A10 10 0 0 1 20 30" fill="none" stroke="currentColor" stroke-width="1.2"/></g><circle cx="17" cy="20" r="7" style="fill:var(--pink)"/></svg>`;

const S = { status:'loading', folders:[], caps:[], view:'home', stack:[], folderId:null, capId:null,
  q:'', filter:'all', tab:'summary', edit:null, confirmDel:false, newFolder:null, rename:null, confirmFolderDel:false,
  ask:null, add:null, keyDraft:null, confirmWipe:false };

/* ---------- local storage (IndexedDB) ---------- */
const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
let IDB=null; const URLS={};
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('catchcatch',1);
  r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('folders',{keyPath:'id'}); d.createObjectStore('captures',{keyPath:'id'}); d.createObjectStore('images'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function tx(store, mode, fn){ return new Promise((res,rej)=>{ const t=IDB.transaction(store,mode); const r=fn(t.objectStore(store)); let out;
  if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const dbAll = s => tx(s,'readonly',st=>st.getAll());
const dbGet = (s,k) => tx(s,'readonly',st=>st.get(k));
const dbPut = (s,v,k) => tx(s,'readwrite',st=> k===undefined ? st.put(v) : st.put(v,k));
const dbDel = (s,k) => tx(s,'readwrite',st=>st.delete(k));
const newId = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Date.now().toString(36)+Math.random().toString(36).slice(2));
async function reload(){
  const [f,c]=await Promise.all([dbAll('folders'),dbAll('captures')]);
  S.folders=f.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); S.caps=c.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  for(const x of S.caps){ if(x.assetId && !URLS[x.assetId]){ const b=await dbGet('images',x.assetId); if(b) URLS[x.assetId]=URL.createObjectURL(b); } }
  S.status='ready'; renderView(); if(S.add && S.add.phase==='review') renderSheet();
}
async function addFolder(name, ai){ const same=S.folders.find(f=>f.name===name); if(same) return same.id; const f={id:newId(), name, ai:!!ai, createdAt:Date.now()}; await dbPut('folders',f); return f.id; }
function storeErr(e){ return (e && (e.name==='QuotaExceededError' || /quota/i.test(String(e.message||'')))) ? '기기 저장 공간이 부족해요. 오래된 캡처를 지운 뒤 다시 시도해 주세요.' : '저장하지 못했어요. 다시 시도해 주세요.'; }

/* ---------- Claude API ---------- */
const MODELS = [['claude-sonnet-5-5','Sonnet 5.5 · 글자를 더 정확히 읽어요'],['claude-haiku-5-5','Haiku 5.5 · 빠르고 저렴해요']];
const AI = { key:()=>LS.get('cc_api_key')||'', model:()=>LS.get('cc_model')||MODELS[0][0], ws:()=>LS.get('cc_ws')||'' };
const hasAI = () => !!AI.key();
async function toApiImage(file){
  const bmp=await createImageBitmap(file); const max=1568; const sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*sc)), h=Math.max(1,Math.round(bmp.height*sc));

function viewSearch(){
  const q=S.q.trim();
  const chips=[['all','전체'],['ocr','이미지 속 글자'],['sum','요약'],['tag','태그']].map(([k,l])=>`<button class="chip" aria-pressed="${S.filter===k}" data-act="filter" data-id="${k}">${l}</button>`).join('');
  let h=`<div class="top"><button class="iconbtn bare" data-act="back" aria-label="뒤로">${ic(I.back)}</button>
    <form data-form="search" style="flex:1;min-width:0" role="search"><label class="searchbar" for="q" style="cursor:text">${ic(I.search,20)}<input id="q" type="search" data-bind="q" value="${esc(S.q)}" placeholder="제목, 요약, 이미지 속 글자, 태그" autocomplete="off" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--ink)"></label></form></div>
    <div class="chips">${chips}</div>`;
  if(q){
    const a=S.ask;
    if(!hasAI()) h+=`<button class="textbtn" data-act="go-settings">${ic(I.spark,16)}API 키를 넣으면 AI에게 물어볼 수 있어요</button>`;
    else if(a && a.q===q && a.phase==='thinking') h+=`<div class="answer"><div style="display:flex;align-items:center;gap:10px;color:var(--ink)">${SPIN(32)}<span class="hint">AI가 저장한 캡처를 훑어보는 중이에요</span></div><button class="btn sm outline" data-act="ask-stop" style="align-self:flex-start">${ic(I.stop,18)}멈추기</button></div>`;
    else if(a && a.q===q && a.phase==='done') h+=`<div class="answer"><span class="flabel">AI 답변</span><p>${esc(a.answer)}</p>${a.ids.length?`<div class="list">${a.ids.map(id=>capOf(id)).filter(Boolean).map(c=>rowHTML(c)).join('')}</div>`:''}</div>`;
    else h+=`${a&&a.q===q&&a.error?`<p class="note err">${esc(a.error)}</p>`:''}<button class="btn outline wide" data-act="ask">${ic(I.spark,20)}‘${esc(q)}’ AI에게 물어보기</button>`;
  }
  if(!q){
    const counts={}; S.caps.forEach(c=>(c.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,16);
    return h+(top.length ? `<section class="section"><div class="sec-head"><h2>자주 쓴 태그</h2></div><div class="chips">${top.map(([t,n])=>`<button class="chip" data-act="tag" data-id="${esc(t)}">#${esc(t)} <span class="fcount">${n}</span></button>`).join('')}</div></section>`
      : `<p class="hint">찾고 싶은 단어를 입력하면 캡처 이미지 속 글자까지 찾아드려요.</p>`);
  }
  const res=searchResults();
  h+=`<section class="section"><div class="sec-head"><h2>결과 ${res.length}개</h2></div>`;
  h+= res.length ? `<div class="list">${res.map(c=>rowHTML(c,q)).join('')}</div>` : `<p class="hint">‘${esc(q)}’와 맞는 캡처가 없어요. 다른 단어로 찾아보거나 필터를 ‘전체’로 바꿔보세요.</p>`;
  return h+`</section>`;
}

    ${S.test && S.test!=='run' ? `<p class="note ${S.test.ok?'':'err'}" style="white-space:pre-wrap">${esc(S.test.msg)}</p>` : `<p>${hasAI()?'AI 정리를 쓸 수 있어요.':'키가 없으면 제목과 요약을 직접 적어서 저장해요.'}</p>`}

    <p class="fcount">캡처 ${S.caps.length}개 · 폴더 ${S.folders.length}개</p>
    <div class="actions"><button class="btn sm" data-act="backup">${ic(I.down,18)}백업 파일 저장</button><button class="btn sm outline" data-act="restore">${ic(I.up,18)}백업 불러오기</button></div>

    <h2>모두 지우기</h2>

      :`<p>이 기기에 저장된 캡처, 이미지, 폴더를 모두 지워요.</p><button class="textbtn danger" data-act="wipe" style="align-self:flex-start">${ic(I.trash,16)}모두 지우기</button>`}
  </div>
  <p class="hint" style="text-align:center">캐치캐치 v1.2 · 캡처의 자음 ㅋㅊ에서, 좋은 정보를 캐치한다는 뜻</p>`;
  return h;
}
function renderView(){
  const html = S.view==='folder' ? viewFolder() : S.view==='detail' ? viewDetail() : S.view==='search' ? viewSearch() : S.view==='settings' ? viewSettings() : viewHome();
  paint($('#view'), html);
  const th=$('#tab-home'), ts=$('#tab-search');
  if(S.view==='home') th.setAttribute('aria-current','page'); else th.removeAttribute('aria-current');
  if(S.view==='search') ts.setAttribute('aria-current','page'); else ts.removeAttribute('aria-current');
}

/* ---------- add sheet ---------- */
function openAdd(mode){
  if(S.status!=='ready'){ toast(S.status==='loading'?'보관함을 여는 중이에요. 잠시 후 다시 눌러주세요.':'이 브라우저에서는 저장할 수 없어요.'); return false; }
  if(S.add && S.add.phase!=='saving') closeAdd();
  S.add={mode:mode||'capture', file:null, preview:null, phase:'pick', note:null, err:null,
    draft:{title:'',summary:'',tags:'',link:'',text:'',source:'',url:'',memo:''}, choice:null, aiFolderId:null, aiNew:'', newName:'', ctl:null};
  $('#sheet').hidden=false; document.body.style.overflow='hidden'; renderSheet(); return true;
}
function closeAdd(){ if(!S.add) return; S.add.ctl?.abort(); if(S.add.preview) URL.revokeObjectURL(S.add.preview); S.add=null; $('#sheet').hidden=true; document.body.style.overflow=''; }
function setFile(file){
  const A=S.add; if(!A) return;
  if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){ A.err='PNG, JPG, WEBP, GIF 이미지만 올릴 수 있어요.'; renderSheet(); return; }
  if(A.preview) URL.revokeObjectURL(A.preview);
  A.mode='capture'; A.file=file; A.preview=URL.createObjectURL(file); A.err=null;
  if(hasAI()) analyze(); else { A.note=errCopy('no_key'); toReview({}); }
}
function analyzePrompt(kind, extra){
  const folders=JSON.stringify(S.folders.map(f=>({id:f.id,name:f.name})));
  const what = kind==='image'
    ? '첨부한 이미지는 사용자가 X(트위터), 인스타그램, 스레드, 웹 등에서 유용한 정보를 보고 찍어둔 스크린샷이야. 이미지를 읽고'
    : '사용자가 저장하려는 링크와 메모가 아래에 있어. 내용을 보고';
  return `${what} 나중에 다시 찾기 쉽도록 정리해줘. 아래 형식의 JSON 하나만, 다른 말 없이 답해.
{"title":"핵심을 담은 한국어 제목, 30자 이내",
 "summary":["핵심 정보를 담은 한국어 문장 3~5개, 각 60자 이내"],
 "text":"${kind==='image'?'이미지 속 글자를 최대한 그대로 옮긴 원문(줄바꿈 유지). 글자가 없으면 빈 문자열':'빈 문자열'}",
 "tags":["주제 태그 2~5개, # 없이"],
 "link":"이미지나 메모에 보이는 URL이 있으면 그대로, 없으면 빈 문자열",
 "source":"X, 인스타그램, 스레드, 유튜브, 웹, 메신저, 기타 중 하나",
 "folderId":"아래 기존 폴더 중 내용과 확실히 맞는 폴더의 id, 맞는 게 없으면 null",
 "newFolder":"맞는 기존 폴더가 없을 때 만들 새 폴더 이름(2~10자, 넓은 주제), 있으면 null"}
기존 폴더: ${folders}${extra?'\n\n'+extra:''}`;
}
async function analyze(){
  const A=S.add; if(!A) return;
  A.phase='thinking'; A.err=null; A.note=null; A.ctl=new AbortController(); renderSheet();
  const isImg = A.mode==='capture';
  const prompt = isImg ? analyzePrompt('image') : analyzePrompt('link', `링크: ${A.draft.url}\n메모/본문:\n${A.draft.memo.slice(0,8000)}`);
  try{
    const r=await askClaude(prompt, isImg ? A.file : null, A.ctl.signal);
    if(S.add!==A) return; toReview(r||{});
  }catch(e){
    if(S.add!==A) return;
    if(e && e.code==='cancelled'){ A.note='분석을 멈췄어요. 직접 적거나 다시 분석할 수 있어요.'; toReview({}); return; }
    A.err=errCopy(e && e.code, e && e.detail); toReview({});
  }
}
function toReview(raw){
  const A=S.add; if(!A) return;
  const arr=v=>Array.isArray(v)?v.map(x=>String(x).trim()).filter(Boolean):(typeof v==='string'&&v?v.split('\n').map(s=>s.trim()).filter(Boolean):[]);
  const d=A.draft;
  if(raw.title) d.title=String(raw.title).slice(0,80);
  if(raw.summary) d.summary=arr(raw.summary).slice(0,6).join('\n');
  if(raw.tags) d.tags=arr(raw.tags).map(t=>t.replace(/^#/,'')).slice(0,8).join(', ');
  if(raw.text) d.text=String(raw.text).slice(0,20000);
  if(raw.source) d.source=String(raw.source).slice(0,20);
  if(raw.link && !d.link) d.link=String(raw.link);
  if(A.mode==='link'){
    if(!d.link) d.link=d.url; if(!d.source) d.source=guessSource(d.url);
    if(!d.text) d.text=d.memo;
    if(!d.title) d.title=(d.memo.split('\n')[0]||'').slice(0,40) || (()=>{ try{ return new URL(d.url).hostname; }catch(e){ return ''; } })();
  }
  const fid = raw.folderId && folderOf(String(raw.folderId)) ? String(raw.folderId) : null;
  A.aiFolderId=fid; A.aiNew = !fid && raw.newFolder ? String(raw.newFolder).slice(0,20) : '';
  if(!A.choice || A.choice==='aiNew' || A.choice===A.aiFolderId || (A.choice!=='new' && !folderOf(A.choice))) A.choice = fid ? fid : A.aiNew ? 'aiNew' : (S.folders[0]?.id || 'new');
  A.phase='review'; renderSheet();
}
function sheetHTML(){
  const A=S.add;
  let h=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab"></div>
  <div class="shead"><h2 id="sh-t">${A.mode==='link'?'링크 저장':'새 캡처'}</h2><button class="iconbtn bare" data-act="close-add" aria-label="닫기">${ic(I.close)}</button></div>`;
  if(A.phase==='pick'){
    h+=`<div class="seg" role="tablist"><button role="tab" aria-selected="${A.mode==='capture'}" data-act="mode" data-id="capture">캡처 이미지</button><button role="tab" aria-selected="${A.mode==='link'}" data-act="mode" data-id="link">링크</button></div>`;
    if(A.err) h+=`<p class="note err">${esc(A.err)}</p>`;
    if(A.mode==='capture'){
      h+=`<div class="drop" id="drop">${LOGO(52,48)}<span>캡처 이미지를 고르면<br>${hasAI()?'AI가 글자를 읽고 요약해요':'제목과 요약을 붙여 저장해요'}</span><button class="btn pink" data-act="pick">${ic(I.image,20)}이미지 고르기</button><span class="hint">컴퓨터에서는 붙여넣기(Ctrl+V)나 끌어다 놓기도 돼요</span></div>`;
    } else {
      h+=`<form class="section" data-form="link"><div class="field"><label for="l-url">링크</label><input id="l-url" class="inp" type="url" inputmode="url" data-bind="add.draft.url" value="${esc(A.draft.url)}" placeholder="https://x.com/..." required></div>
      <div class="field"><label for="l-memo">메모 또는 본문 붙여넣기</label><textarea id="l-memo" class="inp" rows="5" data-bind="add.draft.memo" placeholder="게시글 내용을 붙여넣으면 AI가 더 잘 정리해요">${esc(A.draft.memo)}</textarea></div>
      <button class="btn wide">${hasAI()?ic(I.spark,20)+'AI로 정리하기':'다음'}</button></form>`;
    }
    return h+`</div>`;
  }
  if(A.phase==='thinking'){
    return h+`<div class="thinking">${A.preview?`<span class="thumb" style="width:76px;height:96px;border-radius:16px;flex:none"><img src="${A.preview}" alt=""></span>`:''}${SPIN(56)}<p><b style="color:var(--ink)">AI가 ${A.mode==='capture'?'캡처를 읽고':'내용을 정리하고'} 있어요</b><br>보통 10~30초 걸려요</p><button class="btn sm outline" data-act="stop">${ic(I.stop,18)}멈추기</button></div></div>`;
  }
  if(A.phase==='saving') return h+`<div class="thinking">${SPIN(56)}<p>저장하는 중이에요</p></div></div>`;
  const d=A.draft;
  if(A.preview) h+=`<div class="pv"><span class="thumb"><img src="${A.preview}" alt="올린 캡처 미리보기"></span><div class="rbody"><span class="flabel">${A.err||A.note?'직접 입력':'AI 분석 완료'}</span><span class="hint">${esc(A.file?.name||'')}</span><div class="actions" style="margin-top:6px"><button class="btn sm outline" data-act="pick">다른 이미지</button>${hasAI()?`<button class="btn sm outline" data-act="reanalyze">다시 분석</button>`:''}</div></div></div>`;
  else if(hasAI()) h+=`<div class="actions"><button class="btn sm outline" data-act="reanalyze">${ic(I.spark,18)}다시 분석</button></div>`;
  if(A.err) h+=`<p class="note err">${esc(A.err)}</p>`; else if(A.note) h+=`<p class="note">${esc(A.note)}</p>`;
  h+=`<form class="section" data-form="save" style="gap:16px">
    <div class="field"><label for="f-title">제목</label><input id="f-title" class="inp" data-bind="add.draft.title" value="${esc(d.title)}" placeholder="무엇에 대한 캡처인가요?" maxlength="80"></div>
    <div class="field"><label for="f-sum">요약 (한 줄에 하나씩)</label><textarea id="f-sum" class="inp" rows="4" data-bind="add.draft.summary">${esc(d.summary)}</textarea></div>
    <div class="field"><label for="f-tags">태그 (쉼표로 구분)</label><input id="f-tags" class="inp" data-bind="add.draft.tags" value="${esc(d.tags)}" placeholder="피그마, 단축키"></div>
    <div class="field"><label for="f-link">원문 링크</label><input id="f-link" class="inp" inputmode="url" data-bind="add.draft.link" value="${esc(d.link)}" placeholder="https://"></div>
    ${A.mode==='capture'?`<details ${d.text?'':'open'}><summary>이미지에서 읽은 글자 ${d.text?`· ${d.text.length}자`:''}</summary><textarea id="f-text" class="inp" rows="6" data-bind="add.draft.text">${esc(d.text)}</textarea></details>`:''}
    <div class="section" style="gap:8px"><span class="flabel">어느 폴더에 넣을까요?</span><div class="opts" role="radiogroup" aria-label="폴더">${folderOpts()}</div></div>
    <button class="btn wide" id="save-btn" ${d.title.trim()?'':'disabled'}>${esc(saveLabel())}</button>
    <p class="hint" id="save-hint" style="text-align:center" ${d.title.trim()?'hidden':''}>제목을 적으면 저장할 수 있어요</p>
  </form>`;
  return h+`</div>`;
}
function folderOpts(){
  const A=S.add; const o=[];
  if(A.aiFolderId) o.push({k:A.aiFolderId, name:folderName(A.aiFolderId), desc:`AI 추천 · 캡처 ${countIn(A.aiFolderId)}개`, tag:'AI 추천'});
  if(A.aiNew) o.push({k:'aiNew', name:A.aiNew, desc:'AI가 새 폴더를 만들어 넣어요', tag:'새 폴더'});
  S.folders.filter(f=>f.id!==A.aiFolderId).forEach(f=>o.push({k:f.id, name:f.name, desc:`캡처 ${countIn(f.id)}개`}));
  let h=o.map(x=>`<button type="button" class="opt" role="radio" aria-checked="${A.choice===x.k}" data-act="choose" data-id="${esc(x.k)}"><span class="radio"></span><span class="obody"><span class="oname">${esc(x.name)}</span><span class="odesc">${esc(x.desc)}</span></span>${x.tag?`<span class="badge ${x.k==='aiNew'?'plain':''}">${x.tag}</span>`:''}</button>`).join('');
  h+=`<button type="button" class="opt" role="radio" aria-checked="${A.choice==='new'}" data-act="choose" data-id="new"><span class="radio"></span><span class="obody"><span class="oname">새 폴더 직접 만들기</span><span class="odesc">이름을 정해서 넣어요</span></span></button>`;
  if(A.choice==='new') h+=`<div class="field"><label for="f-new">새 폴더 이름</label><input id="f-new" class="inp" maxlength="20" data-bind="add.newName" value="${esc(A.newName)}" placeholder="예: 개발 팁"></div>`;
  return h;
}
function saveLabel(){ const A=S.add; const n = A.choice==='aiNew' ? A.aiNew : A.choice==='new' ? (A.newName.trim()||'새 폴더') : folderName(A.choice); return `‘${n}’에 저장하기`; }
function renderSheet(){ if(!S.add) return; paint($('#sheet'), sheetHTML()); const dz=$('#drop'); if(dz) wireDrop(dz); }
function wireDrop(dz){
  dz.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{ e.preventDefault(); dz.classList.remove('over'); const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('image/')); if(f) setFile(f); });
}
async function saveAdd(){
  const A=S.add; if(!A || !A.draft.title.trim()) return;
  const d=A.draft; A.phase='saving'; renderSheet();
  try{
    let assetId=null;
    if(A.mode==='capture' && A.file){ assetId=newId(); await dbPut('images', A.file, assetId); URLS[assetId]=URL.createObjectURL(A.file); }
    let folderId=A.choice;
    if(A.choice==='aiNew' || A.choice==='new'){ const name=(A.choice==='aiNew'?A.aiNew:A.newName).trim()||'새 폴더'; folderId=await addFolder(name, A.choice==='aiNew'); }
    const doc={ id:newId(), type:A.mode, assetId, title:d.title.trim().slice(0,80),
      summary:d.summary.split('\n').map(s=>s.replace(/^[-•·\s]+/,'').trim()).filter(Boolean).slice(0,8),
      tags:d.tags.split(/[,，]/).map(t=>t.trim().replace(/^#/,'')).filter(Boolean).slice(0,10),
      text:(d.text||'').slice(0,20000), link:d.link.trim(), source:d.source||guessSource(d.link), folderId, createdAt:now() };
    await dbPut('captures', doc);
    closeAdd(); await reload(); toast('저장했어요');
    S.stack=[{view:'home'}]; S.view='detail'; S.capId=doc.id; S.tab='summary'; S.edit=null; S.confirmDel=false; renderView(); window.scrollTo(0,0);
  }catch(e){ if(!S.add) return; A.err=storeErr(e); A.phase='review'; renderSheet(); }
}

/* ---------- other actions ---------- */
function toMd(c){
  const L=[`# ${c.title||'제목 없음'}`,'',`- 폴더: ${folderName(c.folderId)}`,`- 저장한 날: ${fmtDate(c.createdAt)}`];
  if(c.source) L.push(`- 출처: ${c.source}`); if(c.link) L.push(`- 원문 링크: ${c.link}`);
  if((c.summary||[]).length) L.push('','## 요약',...c.summary.map(s=>`- ${s}`));
  if((c.tags||[]).length) L.push('','## 태그',c.tags.map(t=>'#'+t.replace(/\s+/g,'_')).join(' '));
  if(c.text) L.push('','## 원문 텍스트','',c.text);
  return L.join('\n')+'\n';
}
async function askAI(){
  const q=S.q.trim(); if(!q || !hasAI()) return;
  S.ask?.ctl?.abort(); const ctl=new AbortController(); S.ask={q, phase:'thinking', ctl}; renderView();
  let size=0; const items=[];
  for(const c of S.caps){ const it={id:c.id,title:c.title,folder:folderName(c.folderId),tags:c.tags,summary:c.summary,text:(c.text||'').slice(0,400)};
    const s=JSON.stringify(it).length; if(size+s>60000) break; size+=s; items.push(it); }
  const prompt=`아래는 사용자가 저장해 둔 캡처 목록(JSON)이야. 사용자의 질문에 이 목록만 근거로 한국어로 답해. 목록에 없는 내용은 지어내지 말고, 없으면 없다고 말해. JSON 하나만, 다른 말 없이 답해: {"answer":"3~6문장 답변","ids":["근거가 된 캡처 id, 최대 8개"]}
질문: ${q}
캡처 목록: ${JSON.stringify(items)}`;
  try{
    const r=await askClaude(prompt, null, ctl.signal);
    if(S.ask?.ctl!==ctl) return;
    S.ask={q, phase:'done', answer:String(r?.answer||'답을 찾지 못했어요.'), ids:Array.isArray(r?.ids)?r.ids.map(String).slice(0,8):[]};
  }catch(e){
    if(S.ask?.ctl!==ctl) return;
    S.ask = e && e.code==='cancelled' ? null : {q, phase:'error', error:errCopy(e && e.code, e && e.detail)};
  }
  renderView();
}
async function backup(){
  try{
    const images={};
    for(const c of S.caps){ if(c.assetId && !images[c.assetId]){ const b=await dbGet('images',c.assetId); if(b) images[c.assetId]=await blobToDataURL(b); } }
    const data={app:'catchcatch', version:1, exportedAt:new Date().toISOString(), folders:S.folders, captures:S.caps, images};
    const d=new Date(); const p=n=>String(n).padStart(2,'0');
    download(`캐치캐치-백업-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`, JSON.stringify(data), 'application/json');
    toast('백업 파일을 저장했어요');
  }catch(e){ toast('백업 파일을 만들지 못했어요.'); }
}
async function restore(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data || data.app!=='catchcatch' || !Array.isArray(data.captures)) throw 0;
    for(const [id,url] of Object.entries(data.images||{})){ const b=await (await fetch(url)).blob(); await dbPut('images', b, id); }
    for(const f of (data.folders||[])) if(f && f.id && f.name) await dbPut('folders', f);
    for(const c of data.captures) if(c && c.id) await dbPut('captures', c);
    await reload(); toast(`캡처 ${data.captures.length}개를 불러왔어요`);
  }catch(e){ toast(e && e.name==='QuotaExceededError' ? '기기 저장 공간이 부족해요.' : '캐치캐치 백업 파일이 아니거나 읽을 수 없어요.'); }
}
async function wipe(){
  for(const s of ['captures','folders','images']) await tx(s,'readwrite',st=>st.clear());
  Object.values(URLS).forEach(u=>URL.revokeObjectURL(u)); for(const k in URLS) delete URLS[k];
  S.confirmWipe=false; await reload(); toast('모두 지웠어요');
}

/* ---------- events ---------- */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'go-home': if(S.add) closeAdd(); home(); break;
    case 'go-search': if(S.add) closeAdd(); if(S.view!=='search') go('search'); setTimeout(()=>$('#q')?.focus(),0); break;
    case 'go-settings': S.keyDraft=null; go('settings'); break;
    case 'add': if(openAdd('capture')) $('#file').click(); break;
    case 'close-add': closeAdd(); break;
    case 'mode': S.add.mode=id; S.add.err=null; renderSheet(); break;
    case 'pick': $('#file').click(); break;
    case 'stop': S.add?.ctl?.abort(); break;
    case 'reanalyze': if(S.add.mode==='capture' && !S.add.file) $('#file').click(); else analyze(); break;
    case 'choose': S.add.choice=id; renderSheet(); if(id==='new') setTimeout(()=>$('#f-new')?.focus(),0); break;
    case 'back': back(); break;
    case 'open': go('detail',{capId:id}); break;
    case 'folder': go('folder',{folderId:id}); break;
    case 'tag': S.q=id; S.filter='tag'; if(S.view!=='search') go('search'); else renderView(); break;
    case 'filter': S.filter=id; renderView(); break;
    case 'tab': S.tab=id; renderView(); break;
    case 'newfolder': if(S.status!=='ready') break; S.newFolder=''; renderView(); setTimeout(()=>$('#nf-name')?.focus(),0); break;
    case 'newfolder-cancel': S.newFolder=null; renderView(); break;
    case 'rename': S.rename=folderOf(S.folderId)?.name||''; renderView(); setTimeout(()=>$('#rn-name')?.focus(),0); break;
    case 'rename-cancel': S.rename=null; renderView(); break;
    case 'folder-del': S.confirmFolderDel=true; renderView(); break;
    case 'folder-del-cancel': S.confirmFolderDel=false; renderView(); break;
    case 'folder-del-yes': try{ await dbDel('folders', S.folderId); await reload(); toast('폴더를 삭제했어요'); home(); }catch(err){ toast('삭제하지 못했어요.'); } break;
    case 'edit': { const c=capOf(S.capId); if(!c) break; S.edit={title:c.title||'',summary:(c.summary||[]).join('\n'),tags:(c.tags||[]).join(', '),link:c.link||'',text:c.text||''}; renderView(); break; }
    case 'edit-cancel': S.edit=null; renderView(); break;
    case 'del': S.confirmDel=true; renderView(); break;
    case 'del-cancel': S.confirmDel=false; renderView(); break;
    case 'del-yes': { const c=capOf(S.capId); if(!c) break;
      try{ await dbDel('captures', c.id); if(c.assetId){ await dbDel('images', c.assetId); if(URLS[c.assetId]){ URL.revokeObjectURL(URLS[c.assetId]); delete URLS[c.assetId]; } }
        await reload(); toast('삭제했어요'); back(); }catch(err){ toast('삭제하지 못했어요.'); } break; }
    case 'export': { const c=capOf(S.capId); if(c) download(fname(c.title)+'.md', toMd(c)); break; }
    case 'export-folder': { const list=S.caps.filter(c=> S.folderId==='_none' ? !folderOf(c.folderId) : c.folderId===S.folderId);
      download(fname(S.folderId==='_none'?'미분류':folderName(S.folderId))+'.md', list.map(toMd).join('\n---\n\n')); break; }
    case 'save-img': { const c=capOf(S.capId); if(!c||!c.assetId) break; const b=await dbGet('images',c.assetId); if(!b){ toast('이미지를 찾지 못했어요.'); break; }
      const ext=({'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'})[b.type]||'png'; download(fname(c.title)+'.'+ext, b); break; }
    case 'copy-text': { const c=capOf(S.capId); if(!c) break;
      try{ await navigator.clipboard.writeText(c.text||''); toast('원문을 복사했어요'); }
      catch(err){ const p=document.querySelector('.raw'); if(p){ const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('선택된 글자를 복사하세요'); } } break; }
    case 'ask': askAI(); break;
    case 'ask-stop': S.ask?.ctl?.abort(); break;
    case 'key-clear': LS.del('cc_api_key'); S.keyDraft=''; S.test=null; renderView(); toast('API 키를 지웠어요'); break;
    case 'key-test': S.test='run'; renderView();
      try{ await askClaude('연결 확인이야. {"ok":true} 만 그대로 답해.', null); S.test={ok:true, msg:`연결됐어요. ${AI.model()} 모델로 분석할 수 있어요.`}; }
      catch(err){ S.test={ok:false, msg:errCopy(err && err.code, err && err.detail)}; }
      renderView(); break;
    case 'backup': backup(); break;
    case 'restore': $('#backup-file').click(); break;
    case 'wipe': S.confirmWipe=true; renderView(); break;
    case 'wipe-cancel': S.confirmWipe=false; renderView(); break;
    case 'wipe-yes': wipe(); break;
  }
});
document.addEventListener('submit', async e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const k=f.dataset.form;
  if(k==='search'){ $('#q')?.blur(); return; }
  if(k==='key'){ const v=(S.keyDraft||'').trim(); if(!v){ toast('API 키를 넣어주세요'); return; }
    const ws=(S.wsDraft||'').trim();
    if(ws && !/^wrkspc_[A-Za-z0-9]+$/.test(ws)){ toast('워크스페이스 ID는 wrkspc_로 시작해요'); return; }
    LS.set('cc_api_key', v); if(ws) LS.set('cc_ws', ws); else LS.del('cc_ws'); S.test=null; renderView(); toast('저장했어요'); return; }
  if(k==='link'){ const d=S.add.draft; if(!safeLink(d.url)){ S.add.err='https://로 시작하는 링크를 넣어주세요.'; renderSheet(); return; }
    S.add.err=null; if(hasAI()) analyze(); else { S.add.note=errCopy('no_key'); toReview({}); } return; }
  if(k==='save'){ saveAdd(); return; }
  if(k==='newfolder'){ const name=(S.newFolder||'').trim(); if(!name) return;
    if(S.folders.some(x=>x.name===name)){ toast('같은 이름의 폴더가 있어요'); return; }
    try{ await addFolder(name,false); S.newFolder=null; await reload(); toast('폴더를 만들었어요'); }catch(err){ toast(storeErr(err)); } return; }
  if(k==='rename'){ const name=(S.rename||'').trim(); const fo=folderOf(S.folderId); if(!name||!fo) return;
    try{ await dbPut('folders', Object.assign({}, fo, {name})); S.rename=null; await reload(); }catch(err){ toast('이름을 바꾸지 못했어요.'); } return; }
  if(k==='edit'){ const e2=S.edit, c=capOf(S.capId); if(!c) return;
    try{ await dbPut('captures', Object.assign({}, c, { title:e2.title.trim().slice(0,80)||'제목 없음',
        summary:e2.summary.split('\n').map(s=>s.replace(/^[-•·\s]+/,'').trim()).filter(Boolean).slice(0,8),
        tags:e2.tags.split(/[,，]/).map(t=>t.trim().replace(/^#/,'')).filter(Boolean).slice(0,10),
        link:e2.link.trim(), text:e2.text.slice(0,20000) }));
      S.edit=null; await reload(); toast('수정했어요'); }catch(err){ toast(storeErr(err)); } return; }
});
document.addEventListener('input', e=>{
  const k=e.target.dataset && e.target.dataset.bind; if(!k) return;
  setPath(S,k,e.target.value);
  if(k==='q') renderView();
  else if((k==='add.newName' || k==='add.draft.title') && S.add){ const b=$('#save-btn'), h=$('#save-hint'); if(b){ b.textContent=saveLabel(); b.disabled=!S.add.draft.title.trim(); } if(h) h.hidden=!!S.add.draft.title.trim(); }
});
document.addEventListener('change', async e=>{
  const ch=e.target.dataset && e.target.dataset.change; if(!ch) return;
  if(ch==='move'){ const c=capOf(S.capId), v=e.target.value; if(!c||!v) return;
    try{ await dbPut('captures', Object.assign({}, c, {folderId:v})); await reload(); toast(`‘${folderName(v)}’로 옮겼어요`); }catch(err){ toast('옮기지 못했어요.'); } }
  if(ch==='model'){ LS.set('cc_model', e.target.value); toast('모델을 바꿨어요'); }
});
$('#file').addEventListener('change', e=>{ const f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return; if(!S.add && !openAdd('capture')) return; setFile(f); });
$('#backup-file').addEventListener('change', e=>{ const f=e.target.files && e.target.files[0]; e.target.value=''; if(f) restore(f); });
document.addEventListener('paste', e=>{
  const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/')); if(!f) return;
  e.preventDefault(); if(!S.add && !openAdd('capture')) return; setFile(f);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.add && S.add.phase!=='saving') closeAdd(); });
$('#sheet').addEventListener('click', e=>{ if(e.target.id==='sheet' && S.add && S.add.phase!=='saving') closeAdd(); });

/* ---------- boot ---------- */
(async function boot(){
  renderView();
  try{ IDB=await idbOpen(); }catch(e){ S.status='nostore'; renderView(); return; }
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  try{ await reload(); }catch(e){ S.status='nostore'; renderView(); }
})();
})();
</script>
