<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<title>캐치캐치</title>
<meta name="description" content="캡처와 링크를 올리면 AI가 읽고 요약해 폴더에 정리해 주는 보관함">
<meta name="theme-color" content="#EBEBE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1D1F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캐치캐치">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.ico?v=kc2" sizes="any">
<link rel="icon" href="favicon-32.png?v=kc2" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.svg?v=kc2" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=kc2">
<link rel="manifest" href="manifest.webmanifest?v=kc2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 520px), fixed bottom bar with a pink "sphere" add button, bottom sheet for adding */
:root{
  --bg:#EBEBE9; --surface:#F7F7F5; --sunk:#DEDEDB; --ink:#2A2A2C; --mute:#5E5E62; --line:#D3D3D0;
  --pink:#EDBFC6; --pink-strong:#D98C9C; --on-pink:#2A2A2C; --mark:#F2CCD2; --danger:#A3303F; --ok:#2F6B4A; --scrim:rgba(30,30,32,.38);
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --tabh:calc(70px + env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1D1D1F; --surface:#29292C; --sunk:#333336; --ink:#ECECEA; --mute:#A4A4A8; --line:#3B3B3F;
  --pink:#E6B1BA; --pink-strong:#E6B1BA; --on-pink:#1D1D1F; --mark:#6B4148; --danger:#F08A97; --ok:#8FD1AC; --scrim:rgba(0,0,0,.55); color-scheme:dark}}

html,body{background:var(--bg);margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{position:fixed;inset:0;width:100%}
#scroller{position:fixed;left:0;right:0;top:0;bottom:var(--tabh);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px)}
body.gate #scroller{bottom:0}
button,a,.tab,.addbtn{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-inline:20px;padding-block:16px 48px;display:flex;flex-direction:column;gap:22px}
body.gate .wrap{padding-block:16px 40px}
body.gate .tabbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1}
.logo span{display:block;line-height:1;padding-top:2px}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:22px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);position:relative}
.iconbtn.bare{border-color:transparent}
.iconbtn .ping{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:4px;background:var(--pink)}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
.headline{margin:6px 0 0;font-size:26px;line-height:1.32;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.headline b{font-weight:600}
.searchbar{display:flex;align-items:center;gap:10px;height:52px;width:100%;border:0;border-radius:26px;background:var(--surface);padding-inline:18px;color:var(--mute);cursor:pointer;text-align:left}
.searchbar svg{color:var(--ink)}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center}
.sec-head h2{margin:0;font-size:16px;font-weight:600}
.textbtn{background:none;border:0;color:var(--mute);font-size:13px;min-height:44px;padding:0 4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.textbtn.danger{color:var(--danger)}

.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcard{min-height:104px;border-radius:20px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;border:1px solid transparent;text-align:left;cursor:pointer}
.fcard.picked{border:1.5px solid var(--ink)}
.fchk{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--mute);display:flex;align-items:center;justify-content:center;color:var(--bg)}
.fchk.on{background:var(--ink);border-color:var(--ink)}
.fchk{flex:none}
.fcard > span:only-child{margin-top:auto}
.row.picked{background:var(--surface)}
.row .fchk{margin-left:4px}
.thumb img{-webkit-touch-callout:none;pointer-events:none}
.row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.selbar{position:sticky;bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.fcard.add{background:transparent;border:1px solid var(--line);color:var(--mute);justify-content:center;align-items:center;flex-direction:row;gap:8px}
.fcard.form{grid-column:1/-1;cursor:default;background:var(--surface);min-height:0}
.badge{align-self:flex-start;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:10px;background:var(--pink);color:var(--on-pink);white-space:nowrap}
.badge.plain{background:var(--sunk);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--ink)}
.dot.pink{background:var(--pink)}
.fname{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.fcount{font-family:var(--mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.thumb{flex:0 0 60px;height:60px;border-radius:14px;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:13px;color:var(--mute);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rm{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:var(--mark);color:var(--ink);border-radius:4px;padding:0 2px}

.empty{background:var(--surface);border-radius:24px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty p{margin:0;color:var(--mute);font-size:14px}
.empty h3{margin:0;font-size:17px;font-weight:600}

.btn{height:52px;border-radius:26px;border:0;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn.pink{background:var(--pink);color:var(--on-pink)}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--bg)}
.btn.sm{height:44px;border-radius:22px;font-size:14px;padding:0 16px}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}

.hero{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding-top:8vh}
.hero h1{margin:0;font-size:30px;line-height:1.3;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:var(--mute);font-size:15px}

.tabbar{position:fixed;left:0;right:0;bottom:0;height:var(--tabh);z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px env(safe-area-inset-bottom,0px);transform:translateZ(0)}
.tabs{max-width:520px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.tab{width:64px;height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);cursor:pointer;font-size:11px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.addbtn{width:62px;height:62px;border-radius:31px;border:0;background:var(--pink);color:var(--on-pink);margin-top:-30px;box-shadow:0 0 0 6px var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}

.shot{border-radius:24px;background:var(--surface);overflow:hidden;display:flex;justify-content:center;min-height:120px;align-items:center}
.shot img{display:block;width:100%;max-height:70vh;object-fit:contain}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:24px;background:var(--sunk)}
.seg button{height:40px;border-radius:20px;border:0;background:transparent;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:13px;width:100%;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--surface);font-weight:600}
.dtitle{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.6}
.bul li{display:flex;gap:10px}
.bul li::before{content:"";flex:0 0 6px;height:6px;margin-top:9px;border-radius:3px;background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--surface);border:0;cursor:pointer;min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.raw{white-space:pre-wrap;background:var(--surface);border-radius:18px;padding:16px;font-size:14px;line-height:1.75;overflow-wrap:anywhere;margin:0;font-family:var(--sans)}
.code{white-space:pre;background:var(--bg);border-radius:14px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.6;overflow-x:auto;margin:0}
.meta{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);font-size:14px}
.mrow .v{font-family:var(--mono);font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.mrow a{color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0;text-decoration:none}
.mrow a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel{height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:0 12px;max-width:60%;font-size:16px}
input,textarea,select{font-size:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.confirm{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.confirm p{margin:0;font-size:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.05em}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;min-height:46px}
.card .inp{background:var(--bg)}
textarea.inp{resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--mute);margin:0}
.note{font-size:13px;padding:12px 14px;border-radius:14px;background:var(--sunk);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note.err{color:var(--danger)}
.note.ok{color:var(--ok)}
.card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:16px;font-weight:600}
.card p{margin:0;font-size:13px;color:var(--mute)}
.card a{color:var(--ink)}
.acct{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{flex:0 0 40px;height:40px;border-radius:20px;background:var(--pink);color:var(--on-pink);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct .rbody span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{margin:0;padding-left:20px;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.steps b{font-weight:600}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain;touch-action:none}
.sheet .panel{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.panel{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--bg);border-radius:28px;padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.shead{display:flex;align-items:center;justify-content:space-between}
.shead h2{margin:0;font-size:17px;font-weight:600}
.drop{border:1.5px dashed var(--mute);border-radius:22px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--mute);font-size:14px}
.drop.over{background:var(--surface)}
.pv{display:flex;gap:14px;align-items:center}
.pv .thumb{flex-basis:76px;height:96px;border-radius:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;border-radius:18px;border:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.opt[aria-checked="true"]{border:1.5px solid var(--ink);background:var(--surface)}
.radio{flex:0 0 20px;height:20px;border-radius:10px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--ink)}
.obody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.oname{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.odesc{font-size:12px;color:var(--mute)}
.thinking{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0;text-align:center;color:var(--ink)}
.thinking p{margin:0;font-size:14px;color:var(--mute)}
.spin{animation:spin 2.4s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{flex:none;display:block;animation:spin .9s linear infinite;transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:2.4s}}
.answer{background:var(--surface);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.answer p{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap}
details summary{cursor:pointer;font-size:13px;color:var(--mute);min-height:36px;display:flex;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:30;max-width:calc(100% - 40px)}
.foot{display:flex;justify-content:center;padding-top:12px;opacity:.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* opening splash */
#splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease}
#splash svg{animation:splashIn .7s ease both}
#splash.out{opacity:0;pointer-events:none}
@keyframes splashIn{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-color-scheme: dark){#splash{background:#1D1D1F}}
@media (prefers-reduced-motion: reduce){#splash svg{animation:none}}

/* usage guide (coach marks) */
#tour{position:fixed;inset:0;z-index:60}
#tour .hole{position:fixed;border-radius:20px;border:2px solid var(--pink-strong);box-shadow:0 0 0 9999px rgba(20,20,22,.42);transition:all .25s ease;pointer-events:none}
#tour .hole.none{border-color:transparent;left:50%;top:50%;width:0;height:0}
#tour .tcard{position:fixed;left:50%;transform:translateX(-50%);max-height:calc(100% - 28px);overflow-y:auto;width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.18)}
#tour .tstep{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.12em}
#tour .ttitle{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
#tour .tdesc{margin:0;font-size:14px;line-height:1.65;color:var(--mute);text-wrap:balance}
#tour .tdots{display:flex;gap:6px;margin:6px 0 4px}
#tour .tdots span{width:14px;height:4px;border-radius:2px;background:var(--line)}
#tour .tdots span.on{width:22px;background:var(--ink)}
#tour .tfoot{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:4px}
#tour .tnext{height:44px;min-width:96px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;padding:0 18px;cursor:pointer}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.banner{flex-wrap:wrap}
.banner p{margin:0;flex:1 1 180px;font-size:13px;line-height:1.5;color:var(--mute)}
.banner p b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg width="76" height="89" viewBox="1 1 58 68" fill="none" stroke="#EDBFC6" stroke-width="5.5" stroke-linecap="butt" stroke-linejoin="miter"><path d="M4 14H56M24 14V66M4 38H24M42 2V14M42 14L30 66M42 14L55 66"/></svg></div>
<div id="scroller"><div id="view" class="wrap" aria-live="polite"></div></div>

<nav class="tabbar" aria-label="메뉴">
  <div class="tabs">
    <button class="tab" data-act="go-home" id="tab-home" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H4 Z"/></svg>홈
    </button>
    <button class="addbtn" data-act="add" aria-label="캡처 올리기" id="tab-add">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5 V19 M5 12 H19"/></svg>
    </button>
    <button class="tab" data-act="go-search" id="tab-search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16 L21 21"/></svg>검색
    </button>
  </div>
</nav>

<input type="file" id="file" accept="image/png,image/jpeg,image/webp" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="backup-file" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
<div id="sheet" class="sheet" hidden></div>
<div id="tour" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* Firebase 설정 (구글 로그인용, 공개돼도 괜찮은 값) */

const LocalDB = (()=>{
  let idb=null;
  const open=()=>new Promise((res,rej)=>{ const r=indexedDB.open('catchcatch-local',1);
    r.onupgradeneeded=()=>{ const d=r.result; ['folders','captures','images','meta'].forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const tx=(store,mode,fn)=>new Promise((res,rej)=>{ const t=idb.transaction(store,mode); const r=fn(t.objectStore(store)); let out; if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
  const all=store=>new Promise((res,rej)=>{ const out=[]; const t=idb.transaction(store,'readonly'); const c=t.objectStore(store).openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push(Object.assign({id:cur.key}, cur.value)); cur.continue(); } }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); });
  let listener=null;
  async function emit(){ if(!listener) return; const [f,c]=await Promise.all([all('folders'),all('captures')]); listener(f,c); }
  return {
    kind:'local',
    async init(){ if(!idb) idb=await open(); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} },
    subscribe(fn){ listener=fn; emit(); return ()=>{ listener=null; }; },
    async get(col,id){ return (await tx(col,'readonly',s=>s.get(id))) || null; },
    async set(col,id,data,opt){ let v=data; if(opt && opt.merge){ const old=await tx(col,'readonly',s=>s.get(id)); v=Object.assign({}, old||{}, data); } await tx(col,'readwrite',s=>s.put(v,id)); if(col==='folders'||col==='captures') emit(); },
    async update(col,id,patch){ const old=await tx(col,'readonly',s=>s.get(id)); await tx(col,'readwrite',s=>s.put(Object.assign({}, old||{}, patch), id)); if(col==='folders'||col==='captures') emit(); },
    async del(col,id){ await tx(col,'readwrite',s=>s.delete(id)); if(col==='folders'||col==='captures') emit(); },
    all, async clear(){ for(const n of ['folders','captures','images']) await tx(n,'readwrite',s=>s.clear()); emit(); },
    async count(){ return (await all('captures')).length + (await all('folders')).length; }
  };
})();

function CloudDB(uid){
  const F=FB.F, ref=(c,id)=>F.doc(FB.db,'catchcatch',uid,c,id), col=c=>F.collection(FB.db,'catchcatch',uid,c);
  return {
    kind:'cloud',
    subscribe(fn){

      const onErr=e=>{ S.dataErr = e && e.code==='permission-denied' ? 'perm' : (e && (e.code==='failed-precondition'||e.code==='not-found')) ? 'nodb' : 'other'; renderView(); };
      const u1=F.onSnapshot(col('folders'), s=>{ f=s.docs.map(d=>Object.assign({id:d.id}, d.data())); done(); }, onErr);
      const u2=F.onSnapshot(col('captures'), s=>{ c=s.docs.map(d=>Object.assign({id:d.id}, d.data())); done(); }, onErr);
      return ()=>{ u1(); u2(); };
    },
    async get(c,id){ const s=await F.getDoc(ref(c,id)); return s.exists() ? s.data() : null; },
    set(c,id,data,opt){ return opt ? F.setDoc(ref(c,id), data, opt) : F.setDoc(ref(c,id), data); },
    update(c,id,patch){ return F.updateDoc(ref(c,id), patch); },
    del(c,id){ return F.deleteDoc(ref(c,id)); }
  };
}

const MAX_UPLOAD = 5*1024*1024;
const blobToB64 = b => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); });
async function compressImage(blob, maxW, maxPixels, maxB64){
  const bmp=await createImageBitmap(blob);
  let q=0.86, scale=Math.min(1, maxW/bmp.width, Math.sqrt(maxPixels/(bmp.width*bmp.height))), out='';
  for(let i=0;i<8;i++){
    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(bmp,0,0,w,h);
    out=await blobToB64(await new Promise(r=>c.toBlob(r,'image/jpeg',q)));
    if(out.length<=maxB64) return out;
    if(q>0.62) q-=0.12; else scale*=0.82;
  }
  return out;
}

const wait=(ms,signal)=>new Promise((res,rej)=>{ const t=setTimeout(res,ms); if(signal) signal.addEventListener('abort',()=>{ clearTimeout(t); rej({code:'cancelled'}); },{once:true}); });
async function aiErr(r){
  const s=r.status; let detail='', status='';
  try{ const ej=await r.json(); detail=String(ej?.error?.message||''); status=String(ej?.error?.status||''); }catch(e){}
  let code;
  if(/API key not valid|API_KEY_INVALID|API key expired/i.test(detail)) code='bad_key';
  else if(/location is not supported/i.test(detail)) code='region';
  else if(/billing|exceeded your current quota/i.test(detail) && s!==429) code='no_credit';
  else if(s===429 || status==='RESOURCE_EXHAUSTED') code='rate_limited';
  else if(s===403) code='forbidden';
  else if(s===404) code='bad_model';
  else if(s>=500) code='overloaded';

  else code='http';
  return {code, detail: detail ? `${s} · ${detail.slice(0,300)}` : String(s)};

  if(j.promptFeedback && j.promptFeedback.blockReason) throw {code:'refused'};
  const cand=(j.candidates||[])[0]; if(!cand) throw {code:'invalid_json'};
  if(cand.finishReason==='SAFETY' || cand.finishReason==='PROHIBITED_CONTENT') throw {code:'refused'};

}
function errCopy(code, detail){ const base=errBase(code); return detail && !['no_key','cancelled'].includes(code) ? `${base}\n오류 내용: ${detail}` : base; }
function errBase(code){

    case 'overloaded': return '지금 Gemini 서버에 사용자가 몰려서 응답하지 못했어요. 앱 문제가 아니라 구글 쪽 일시적인 혼잡이에요. 몇 분 뒤 다시 분석을 눌러주세요.';

/* ============ helpers ============ */
function relTime(t){ if(!t) return ''; const d=now()-t, m=Math.floor(d/60000);
  if(m<1) return '방금'; if(m<60) return m+'분 전'; const h=Math.floor(m/60); if(h<24) return h+'시간 전';
  const a=new Date(t), y=new Date(); y.setDate(y.getDate()-1); if(a.toDateString()===y.toDateString()) return '어제';
  return (a.getMonth()+1)+'월 '+a.getDate()+'일'; }
function fmtDate(t){ const d=new Date(t||0); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
const isToday = t => t && new Date(t).toDateString()===new Date().toDateString();
const folderOf = id => S.folders.find(f=>f.id===id);
const folderName = id => folderOf(id)?.name || '미분류';
const countIn = id => S.caps.filter(c=> id==='_none' ? !folderOf(c.folderId) : c.folderId===id).length;
const capOf = id => S.caps.find(c=>c.id===id);
const thumbUrl = c => c.thumb ? 'data:image/jpeg;base64,'+c.thumb : '';
function safeLink(u){ try{ const x=new URL(String(u).trim()); return (x.protocol==='https:'||x.protocol==='http:') ? x.href : ''; }catch(e){ return ''; } }
function guessSource(u){ const h=(()=>{ try{ return new URL(u).hostname; }catch(e){ return ''; } })();
  if(/(^|\.)(x|twitter)\.com$/.test(h)) return 'X'; if(/instagram/.test(h)) return '인스타그램'; if(/threads/.test(h)) return '스레드';
  if(/youtu/.test(h)) return '유튜브'; return h ? '웹' : ''; }
function hl(text, q){ text=String(text||''); if(!q) return esc(text); const lo=text.toLowerCase(), ql=q.toLowerCase(); let out='', i=0, j;
  while((j=lo.indexOf(ql,i))!==-1){ out+=esc(text.slice(i,j))+'<mark>'+esc(text.slice(j,j+q.length))+'</mark>'; i=j+q.length; } return out+esc(text.slice(i)); }
function snippet(text, q){ text=String(text||'').replace(/\s+/g,' '); const j=text.toLowerCase().indexOf(q.toLowerCase()); if(j<0) return '';
  const a=Math.max(0,j-28), b=Math.min(text.length,j+q.length+48); return (a>0?'…':'')+hl(text.slice(a,b),q)+(b<text.length?'…':''); }
function setPath(obj, path, val){ const k=path.split('.'); let o=obj; for(let i=0;i<k.length-1;i++){ o=o[k[i]]; if(!o) return; } o[k[k.length-1]]=val; }
function paint(el, html){ const ae=document.activeElement; let id=null,a=null,b=null;
  if(ae && el.contains(ae) && ae.id){ id=ae.id; try{ a=ae.selectionStart; b=ae.selectionEnd; }catch(e){} }
  el.innerHTML=html;
  if(id){ const n=document.getElementById(id); if(n){ n.focus({preventScroll:true}); try{ if(a!=null) n.setSelectionRange(a,b); }catch(e){} } } }
function download(name, data, type){
  const blob = data instanceof Blob ? data : new Blob([data],{type:type||'text/markdown;charset=utf-8'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 5000);
}
const fname = s => (String(s||'캐치캐치').replace(/[\\/:*?"<>|\r\n]+/g,' ').trim().slice(0,60) || '캐치캐치');
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('복사했어요'); }catch(e){ toast('길게 눌러 직접 복사해 주세요'); } }
function buildFields(raw, base){
  const arr=v=>Array.isArray(v)?v.map(x=>String(x).trim()).filter(Boolean):(typeof v==='string'&&v?v.split('\n').map(x=>x.trim()).filter(Boolean):[]);
  const link=String(raw.link||base.url||'').trim();
  const aiFolderId = raw.folderId && folderOf(String(raw.folderId)) ? String(raw.folderId) : '';
  return { title:String(raw.title||base.title||'').slice(0,80), summary:arr(raw.summary).slice(0,6), tags:arr(raw.tags).map(t=>t.replace(/^#/,'')).slice(0,8),
    text:String(raw.text || base.text || '').slice(0,20000), link, source:String(raw.source||guessSource(link)||'').slice(0,20),
    aiFolderId, aiNew: !aiFolderId && raw.newFolder ? String(raw.newFolder).slice(0,20) : '' };
}

    <button class="textbtn danger" data-act="del" style="align-self:flex-start">${ic(I.trash,16)}캡처 삭제</button>`;

function searchResults(){
  const q=S.q.trim(); if(!q) return [];
  const ql=q.toLowerCase(), f=S.filter;
  return S.caps.filter(c=>{
    const fields = f==='ocr' ? [c.text] : f==='sum' ? [c.title,(c.summary||[]).join(' ')] : f==='tag' ? [(c.tags||[]).join(' ')]
      : [c.title,(c.summary||[]).join(' '),c.text,(c.tags||[]).join(' '),folderName(c.folderId),c.source];
    return fields.some(x=>String(x||'').toLowerCase().includes(ql));
  });
}
function viewSearch(){
  const q=S.q.trim();
  const chips=[['all','전체'],['ocr','이미지 속 글자'],['sum','요약'],['tag','태그']].map(([k,l])=>`<button class="chip" aria-pressed="${S.filter===k}" data-act="filter" data-id="${k}">${l}</button>`).join('');
  let h=`<div class="top"><button class="iconbtn bare" data-act="back" aria-label="뒤로">${ic(I.back)}</button>
    <form data-form="search" style="flex:1;min-width:0" role="search"><label class="searchbar" for="q" style="cursor:text">${ic(I.search,20)}<input id="q" type="search" data-bind="q" value="${esc(S.q)}" placeholder="제목, 요약, 이미지 속 글자, 태그" autocomplete="off" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--ink)"></label></form></div>
    <div class="chips">${chips}</div>`;
  if(q){
    const a=S.ask;
    if(!hasAI()) h+=`<button class="textbtn" data-act="go-ai">${ic(I.spark,16)}내 AI를 연결하면 AI에게 물어볼 수 있어요</button>`;
    else if(a && a.q===q && a.phase==='thinking') h+=`<div class="answer"><div style="display:flex;align-items:center;gap:10px">${SPIN(28)}<span class="hint">AI가 저장한 캡처를 훑어보는 중이에요</span></div><button class="btn sm outline" data-act="ask-stop" style="align-self:flex-start">${ic(I.stop,18)}멈추기</button></div>`;
    else if(a && a.q===q && a.phase==='done') h+=`<div class="answer"><span class="flabel">AI 답변</span><p>${esc(a.answer)}</p>${a.ids.length?`<div class="list">${a.ids.map(id=>capOf(id)).filter(Boolean).map(c=>rowHTML(c)).join('')}</div>`:''}</div>`;
    else h+=`${a&&a.q===q&&a.error?`<p class="note err">${esc(a.error)}</p>`:''}<button class="btn outline wide" data-act="ask">${ic(I.spark,20)}‘${esc(q)}’ AI에게 물어보기</button>`;
  }
  if(!q){
    const counts={}; S.caps.forEach(c=>(c.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,16);
    return h+(top.length ? `<section class="section"><div class="sec-head"><h2>자주 쓴 태그</h2></div><div class="chips">${top.map(([t,n])=>`<button class="chip" data-act="tag" data-id="${esc(t)}">#${esc(t)} <span class="fcount">${n}</span></button>`).join('')}</div></section>` : `<p class="hint">찾고 싶은 단어를 입력하면 캡처 이미지 속 글자까지 찾아드려요.</p>`);
  }
  const res=searchResults();
  h+=`<section class="section"><div class="sec-head"><h2>결과 ${res.length}개</h2></div>`;
  h+= res.length ? `<div class="list">${res.map(c=>rowHTML(c,q)).join('')}</div>` : `<p class="hint">‘${esc(q)}’와 맞는 캡처가 없어요. 다른 단어로 찾아보거나 필터를 ‘전체’로 바꿔보세요.</p>`;
  return h+`</section>`;
}

  if(S.add) closeAdd();
  S.add={mode:mode||'capture', file:null, preview:null, img:null, phase:'pick', note:null, err:null, status:'',
    draft:{title:'',summary:'',tags:'',link:'',text:'',source:'',url:'',memo:''}, choice:null, aiFolderId:null, aiNew:'', newName:'', ctl:null};

function closeAdd(){ if(!S.add) return; S.add.ctl?.abort(); if(S.add.preview) URL.revokeObjectURL(S.add.preview); S.add=null; $('#sheet').hidden=true; }
async function setFile(file){
  const A=S.add; if(!A) return;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)){ A.phase='pick'; A.err='PNG, JPG, WEBP 이미지만 올릴 수 있어요. GIF는 올릴 수 없어요.'; renderSheet(); return; }
  if(file.size > MAX_UPLOAD){ A.phase='pick'; A.err=`5MB 이하 이미지만 올릴 수 있어요. 고른 이미지는 ${(file.size/1048576).toFixed(1)}MB예요.`; renderSheet(); return; }
  if(A.preview) URL.revokeObjectURL(A.preview);
  A.mode='capture'; A.file=file; A.preview=URL.createObjectURL(file); A.err=null; A.img=null; A.status='';
  A.phase='thinking'; renderSheet();
  try{ A.img={full:await fullImage(file), thumb:await thumbImage(file)}; }
  catch(e){ if(S.add!==A) return; A.phase='pick'; A.err='이미지를 읽지 못했어요. 다른 파일을 골라주세요.'; renderSheet(); return; }
  if(S.add!==A) return;
  if(hasAI()) analyze(); else { A.note=errCopy('no_key'); toReview({}); }
}
function analyzePrompt(kind, extra){
  const folders=JSON.stringify(S.folders.map(f=>({id:f.id,name:f.name})));
  const what = kind==='image'
    ? '첨부한 이미지는 사용자가 X(트위터), 인스타그램, 스레드, 웹 등에서 유용한 정보를 보고 찍어둔 스크린샷이야. 이미지를 읽고'
    : '사용자가 저장하려는 링크와 메모가 아래에 있어. 내용을 보고';
  return `${what} 나중에 다시 찾기 쉽도록 정리해줘. 아래 형식의 JSON 하나만, 다른 말 없이 답해.
{"title":"핵심을 담은 한국어 제목, 30자 이내",
 "summary":["핵심 정보를 담은 한국어 문장 3~5개, 각 60자 이내"],
 "text":"${kind==='image'?'이미지 속 글자를 최대한 그대로 옮긴 원문(줄바꿈 유지). 글자가 없으면 빈 문자열':'빈 문자열'}",
 "tags":["주제 태그 2~5개, # 없이"],
 "link":"이미지나 메모에 보이는 URL이 있으면 그대로, 없으면 빈 문자열",
 "source":"X, 인스타그램, 스레드, 유튜브, 웹, 메신저, 기타 중 하나",
 "folderId":"아래 기존 폴더 중 내용과 확실히 맞는 폴더의 id, 맞는 게 없으면 null",
 "newFolder":"맞는 기존 폴더가 없을 때 만들 새 폴더 이름(2~10자, 넓은 주제), 있으면 null"}
기존 폴더: ${folders}${extra?'\n\n'+extra:''}`;
}
async function analyze(){
  const A=S.add; if(!A) return;
  A.phase='thinking'; A.err=null; A.note=null; A.status=''; A.ctl=new AbortController(); renderSheet();
  const isImg = A.mode==='capture';
  const prompt = isImg ? analyzePrompt('image') : analyzePrompt('link', `링크: ${A.draft.url}\n메모/본문:\n${A.draft.memo.slice(0,8000)}`);
  try{
    const r=await callAI(prompt, isImg && A.img ? A.img.full : null, A.ctl.signal, msg=>{ if(S.add===A){ A.status=msg; renderSheet(); } });
    if(S.add!==A) return; toReview(r||{});
  }catch(e){
    if(S.add!==A) return;
    if(e && e.code==='cancelled'){ A.note='분석을 멈췄어요. 직접 적거나 다시 분석할 수 있어요.'; toReview({}); return; }
    A.err=errCopy(e && e.code, e && e.detail); toReview({});
  }
}
function toReview(raw){
  const A=S.add; if(!A) return;
  A.ctl=null;
  const f=buildFields(raw, A.mode==='link' ? {url:A.draft.url, text:A.draft.memo, title:(A.draft.memo.split('\n')[0]||'').slice(0,40) || (()=>{ try{ return new URL(A.draft.url).hostname; }catch(e){ return ''; } })()} : {});
  const d=A.draft;
  if(raw.title || !d.title) d.title=f.title;
  if(raw.summary) d.summary=f.summary.join('\n');
  if(raw.tags) d.tags=f.tags.join(', ');
  if(raw.text || (A.mode==='link' && !d.text)) d.text=f.text;
  if(f.source && !d.source) d.source=f.source;
  if(f.link && !d.link) d.link=f.link;
  A.aiFolderId=f.aiFolderId; A.aiNew=f.aiNew;
  if(!A.choice || A.choice==='aiNew' || A.choice===A.aiFolderId || (A.choice!=='new' && !folderOf(A.choice))) A.choice = f.aiFolderId ? f.aiFolderId : f.aiNew ? 'aiNew' : (S.folders[0]?.id || 'new');
  A.phase='review'; renderSheet();
}

function toMd(c){

async function askQuestion(){
  const q=S.q.trim(); if(!q || !hasAI()) return;
  S.ask?.ctl?.abort(); const ctl=new AbortController(); S.ask={q, phase:'thinking', ctl}; renderView();
  let size=0; const items=[];
  for(const c of S.caps){ const it={id:c.id,title:c.title,folder:folderName(c.folderId),tags:c.tags,summary:c.summary,text:(c.text||'').slice(0,400)};
    const s=JSON.stringify(it).length; if(size+s>60000) break; size+=s; items.push(it); }
  const prompt=`아래는 사용자가 저장해 둔 캡처 목록(JSON)이야. 사용자의 질문에 이 목록만 근거로 한국어로 답해. 목록에 없는 내용은 지어내지 말고, 없으면 없다고 말해. JSON 하나만, 다른 말 없이 답해: {"answer":"3~6문장 답변","ids":["근거가 된 캡처 id, 최대 8개"]}
질문: ${q}
캡처 목록: ${JSON.stringify(items)}`;
  try{
    const r=await callAI(prompt, null, ctl.signal);
    if(S.ask?.ctl!==ctl) return;
    S.ask={q, phase:'done', answer:String(r?.answer||'답을 찾지 못했어요.'), ids:Array.isArray(r?.ids)?r.ids.map(String).slice(0,8):[]};
  }catch(e){
    if(S.ask?.ctl!==ctl) return;
    S.ask = e && e.code==='cancelled' ? null : {q, phase:'error', error:errCopy(e && e.code, e && e.detail)};
  }
  renderView();
}

async function restore(file){
  S.busy='백업 파일을 불러오는 중이에요'; renderView();
  try{
    const data=JSON.parse(await file.text());
    if(!data || data.app!=='catchcatch' || !Array.isArray(data.captures)) throw {msg:'캐치캐치 백업 파일이 아니에요.'};
    for(const f of (data.folders||[])) if(f && f.id && f.name){ const {id, ...rest}=f; await DB.set('folders', id, Object.assign({ai:false, createdAt:now()}, rest)); }
    let n=0;
    for(const c of data.captures){ if(!c || !c.id) continue; const {id, ...rest}=c; const doc=Object.assign({}, rest);
      if(c.assetId && data.images && data.images[c.assetId]){
        S.busy=`불러오는 중 ${++n}/${data.captures.length}`; renderView();
        const blob=await (await fetch(data.images[c.assetId])).blob();
        const full=await fullImage(blob), thumb=await thumbImage(blob);
        await DB.set('images', c.assetId, {data:full, mime:'image/jpeg', createdAt:now()}); doc.thumb=thumb;
      }
      Object.keys(doc).forEach(k=>{ if(doc[k]===undefined) delete doc[k]; });
      await DB.set('captures', id, doc); }
    toast(`캡처 ${data.captures.length}개를 불러왔어요`);
  }catch(e){ toast(e && e.msg || fsErr(e)); }
  S.busy=''; renderView();
}

const TOUR={on:false, i:0};
function startTour(){ if(S.add) closeAdd(); S.stack=[]; S.view='home'; renderView(); toTop(); TOUR.on=true; TOUR.i=0; $('#tour').hidden=false; placeTour(); }
function endTour(){ TOUR.on=false; $('#tour').hidden=true; $('#tour').innerHTML=''; LS.set('cc_tour_done','1'); }
function placeTour(){
  if(!TOUR.on) return;
  const st=TOUR_STEPS[TOUR.i], n=TOUR_STEPS.length, last=TOUR.i===n-1;
  const el = st.sel ? document.querySelector(st.sel) : null;
  /* bring a target inside the scrolling area near the top, so the guide card fits under it */
  if(el && el.closest('#scroller')){ const sc=$('#scroller'); const r0=el.getBoundingClientRect(), sr=sc.getBoundingClientRect(); sc.scrollTop += (r0.top - sr.top) - 24; }
  const r = el ? el.getBoundingClientRect() : null, pad=8, m=14;
  const hole = r ? `<div class="hole" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px;border-radius:${el.id==='tab-add'?'40px':'22px'}"></div>` : `<div class="hole none"></div>`;
  $('#tour').innerHTML = hole + `<div class="tcard" role="dialog" aria-modal="true" aria-labelledby="t-title" style="top:0;visibility:hidden">
    <span class="tstep">${TOUR.i+1} / ${n}</span>
    <h2 class="ttitle" id="t-title">${esc(st.t)}</h2>
    <p class="tdesc">${esc(st.d)}</p>
    <div class="tdots" aria-hidden="true">${TOUR_STEPS.map((_,k)=>`<span class="${k===TOUR.i?'on':''}"></span>`).join('')}</div>
    <div class="tfoot"><button class="textbtn" data-act="tour-skip">건너뛰기</button><button class="tnext" data-act="tour-next">${last?'시작하기':'다음'}</button></div>
  </div>`;
  const card=$('#tour .tcard'), ch=card.offsetHeight, vh=window.innerHeight;
  let top;
  if(!r) top=(vh-ch)/2;
  else {
    const below=vh-(r.bottom+pad)-m, above=(r.top-pad)-m;
    if(below >= ch+m) top=r.bottom+pad+m;
    else if(above >= ch+m) top=r.top-pad-m-ch;
    else top=vh-ch-m;
  }
  top=Math.max(m, Math.min(top, vh-ch-m));
  card.style.top=Math.round(top)+'px'; card.style.visibility='visible';
}
window.addEventListener('resize', ()=>{ if(TOUR.on) placeTour(); });

document.addEventListener('click', async e=>{

  switch(act){
    case 'tour-next': if(TOUR.i < TOUR_STEPS.length-1){ TOUR.i++; placeTour(); } else endTour(); break;
    case 'tour-skip': endTour(); break;

    case 'migrate': migrateLocal(); break;
    case 'go-home': if(S.add) closeAdd(); S.selMode=false; S.sel=new Set(); S.confirmBulk=false; home(); break;

    case 'go-settings': S.aiDraft=null; S.test=null; if(S.view!=='settings') go('settings'); break;
    case 'go-account': S.aiDraft=null; S.test=null; if(S.view!=='settings') go('settings'); setTimeout(()=>{ const c=$('#acct-card'); if(c) c.scrollIntoView({behavior:'smooth', block:'start'}); },60); break;
    case 'go-ai': S.aiDraft=null; S.test=null; if(S.view!=='settings') go('settings'); setTimeout(()=>{ const c=$('#ai-card'); if(c) c.scrollIntoView({behavior:'smooth', block:'start'}); },60); break;
    case 'add': openAdd('capture'); break;
    case 'close-add': closeAdd(); break;
    case 'close-move': closeMove(); break;
    case 'mv-pick': doMove(id||''); break;
    case 'csel-start': S.capSelMode=true; S.capSel=new Set(); S.confirmCapDel=false; S.rename=null; renderView(); break;
    case 'csel-done': S.capSelMode=false; S.capSel=new Set(); S.confirmCapDel=false; renderView(); break;
    case 'csel': if(S.capSel.has(id)) S.capSel.delete(id); else S.capSel.add(id); S.confirmCapDel=false; renderView(); break;
    case 'csel-all': { const list=S.caps.filter(c=> S.folderId==='_none' ? !folderOf(c.folderId) : c.folderId===S.folderId); S.capSel = S.capSel.size===list.length ? new Set() : new Set(list.map(c=>c.id)); S.confirmCapDel=false; renderView(); break; }
    case 'cmove': if(S.capSel.size) openMove([...S.capSel]); break;
    case 'cdel-ask': if(S.capSel.size){ S.confirmCapDel=true; renderView(); } break;
    case 'cdel-cancel': S.confirmCapDel=false; renderView(); break;
    case 'cdel-yes': { let n=0; for(const id of S.capSel){ const c=capOf(id); if(!c) continue; write(DB.del('captures', c.id)).catch(()=>{}); if(c.assetId){ write(DB.del('images', c.assetId)).catch(()=>{}); delete FULL[c.assetId]; } n++; }
      S.caps=S.caps.filter(c=>!S.capSel.has(c.id)); S.capSelMode=false; S.capSel=new Set(); S.confirmCapDel=false; renderView(); toast(`캡처 ${n}개를 삭제했어요`); break; }
    case 'mode': S.add.mode=id; S.add.err=null; renderSheet(); break;
    case 'pick': $('#file').multiple=false; $('#file').click(); break;
    case 'stop': S.add?.ctl?.abort(); break;
    case 'reanalyze': if(S.add.mode==='capture' && !S.add.img) $('#file').click(); else analyze(); break;
    case 'choose': S.add.choice=id; renderSheet(); if(id==='new') setTimeout(()=>$('#f-new')?.focus(),0); break;
    case 'back': back(); break;
    case 'open': go('detail',{capId:id}); break;
    case 'folder': go('folder',{folderId:id}); break;
    case 'sel-start': S.selMode=true; S.sel=new Set(); S.confirmBulk=false; S.newFolder=null; renderView(); break;
    case 'sel-done': S.selMode=false; S.sel=new Set(); S.confirmBulk=false; renderView(); break;
    case 'fsel': if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); S.confirmBulk=false; renderView(); break;
    case 'sel-all': S.sel = S.sel.size===S.folders.length ? new Set() : new Set(S.folders.map(f=>f.id)); S.confirmBulk=false; renderView(); break;
    case 'bulk-ask': if(S.sel.size){ S.confirmBulk=true; renderView(); } break;
    case 'bulk-cancel': S.confirmBulk=false; renderView(); break;
    case 'bulk-del': {
      const ids=[...S.sel], withCaps=id==='all', t=now(); let nc=0;
      for(const c of S.caps.filter(c=>S.sel.has(c.folderId))){
        if(withCaps){ write(DB.del('captures', c.id)).catch(()=>{}); if(c.assetId){ write(DB.del('images', c.assetId)).catch(()=>{}); delete FULL[c.assetId]; } nc++; }
        else write(DB.update('captures', c.id, {folderId:'', updatedAt:t})).catch(()=>{});
      }
      for(const fid of ids) write(DB.del('folders', fid)).catch(()=>{});
      S.selMode=false; S.sel=new Set(); S.confirmBulk=false; renderView();
      toast(withCaps && nc ? `폴더 ${ids.length}개와 캡처 ${nc}개를 삭제했어요` : `폴더 ${ids.length}개를 삭제했어요`); break; }
    case 'tag': S.q=id; S.filter='tag'; if(S.view!=='search') go('search'); else renderView(); break;
    case 'filter': S.filter=id; renderView(); break;
    case 'tab': S.tab=id; renderView(); break;
    case 'newfolder': S.newFolder=''; renderView(); setTimeout(()=>$('#nf-name')?.focus(),0); break;
    case 'newfolder-cancel': S.newFolder=null; renderView(); break;
    case 'rename': S.rename=folderOf(S.folderId)?.name||''; renderView(); setTimeout(()=>$('#rn-name')?.focus(),0); break;
    case 'rename-cancel': S.rename=null; renderView(); break;
    case 'folder-del': S.confirmFolderDel=true; renderView(); break;
    case 'folder-del-cancel': S.confirmFolderDel=false; renderView(); break;
    case 'folder-del-yes': write(DB.del('folders', S.folderId)).catch(()=>{}); toast('폴더를 삭제했어요'); home(); break;
    case 'edit': { const c=capOf(S.capId); if(!c) break; S.edit={title:c.title||'',summary:(c.summary||[]).join('\n'),tags:(c.tags||[]).join(', '),link:c.link||'',text:c.text||''}; renderView(); break; }
    case 'edit-cancel': S.edit=null; renderView(); break;
    case 'del': S.confirmDel=true; renderView(); break;
    case 'del-cancel': S.confirmDel=false; renderView(); break;
    case 'del-yes': { const c=capOf(S.capId); if(!c) break;
      write(DB.del('captures', c.id)).catch(()=>{}); if(c.assetId){ write(DB.del('images', c.assetId)).catch(()=>{}); delete FULL[c.assetId]; }
      toast('삭제했어요'); back(); break; }
    case 'reai': { const c=capOf(S.capId); if(c && !S.reai) reorganize(c); break; }
    case 'export': { const c=capOf(S.capId); if(c) download(fname(c.title)+'.md', toMd(c)); break; }
    case 'export-folder': { const list=S.caps.filter(c=> S.folderId==='_none' ? !folderOf(c.folderId) : c.folderId===S.folderId);
      download(fname(S.folderId==='_none'?'미분류':folderName(S.folderId))+'.md', list.map(toMd).join('\n---\n\n')); break; }
    case 'save-img': { const c=capOf(S.capId); if(!c||!c.assetId) break; const u=FULL[c.assetId]; if(!u){ toast('이미지를 불러오는 중이에요. 잠시 후 다시 눌러주세요.'); break; }
      download(fname(c.title)+'.jpg', await (await fetch(u)).blob()); break; }
    case 'copy-text': { const c=capOf(S.capId); if(c) copyText(c.text||''); break; }
    case 'ask': askQuestion(); break;
    case 'ask-stop': S.ask?.ctl?.abort(); break;
    case 'key-clear': delete AIS.keys.gemini; aiSave(); S.aiDraft=null; S.test=null; renderView(); toast('키를 지웠어요'); break;
    case 'key-test': S.test='run'; renderView();
      try{ await callAI('연결 확인이야. {"ok":true} 만 그대로 답해.', null); S.test={ok:true, msg:`연결됐어요. ${aiModel()} 모델로 분석할 수 있어요.`}; }
      catch(err){ S.test={ok:false, msg:errCopy(err && err.code, err && err.detail)}; }
      renderView(); break;
    case 'logout': S.confirmLogout=true; renderView(); break;
    case 'logout-cancel': S.confirmLogout=false; renderView(); break;
    case 'logout-yes': logout(); break;
    case 'backup': backup(); break;
    case 'restore': $('#backup-file').click(); break;
  }
});
document.addEventListener('submit', e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const k=f.dataset.form;
  if(k==='search'){ $('#q')?.blur(); return; }
  if(k==='key'){ const D=S.aiDraft; if(!D) return; const v=(D.key||'').trim(); if(!v){ toast('API 키를 붙여넣어 주세요'); return; }
    AIS.keys.gemini=v; AIS.models.gemini=D.model; aiSave(); S.test=null; renderView(); toast('연결했어요. 연결 테스트를 눌러 확인해 보세요'); return; }
  if(k==='link'){ const d=S.add.draft; if(!safeLink(d.url)){ S.add.err='https://로 시작하는 링크를 넣어주세요.'; renderSheet(); return; }
    S.add.err=null; if(hasAI()) analyze(); else { S.add.note=errCopy('no_key'); toReview({}); } return; }
  if(k==='save'){ saveAdd(); return; }
  if(k==='mvnew'){ const name=(S.move?.newName||'').trim(); if(!name){ toast('새 폴더 이름을 적어주세요'); return; } doMove(addFolder(name,false)); return; }
  if(k==='newfolder'){ const name=(S.newFolder||'').trim(); if(!name) return;
    if(S.folders.some(x=>x.name===name)){ toast('같은 이름의 폴더가 있어요'); return; }
    addFolder(name,false); S.newFolder=null; renderView(); toast('폴더를 만들었어요'); return; }
  if(k==='rename'){ const name=(S.rename||'').trim(); if(!name || !folderOf(S.folderId)) return;
    write(DB.update('folders', S.folderId, {name, updatedAt:now()})).catch(()=>{}); S.rename=null; renderView(); return; }
  if(k==='edit'){ const e2=S.edit, c=capOf(S.capId); if(!c) return;
    write(DB.update('captures', c.id, { title:e2.title.trim().slice(0,80)||'제목 없음',
        summary:e2.summary.split('\n').map(s=>s.replace(/^[-•·\s]+/,'').trim()).filter(Boolean).slice(0,8),
        tags:e2.tags.split(/[,，]/).map(t=>t.trim().replace(/^#/,'')).filter(Boolean).slice(0,10),
        link:e2.link.trim(), text:e2.text.slice(0,20000), updatedAt:now() })).catch(()=>{});
    S.edit=null; renderView(); toast('수정했어요'); return; }
});
document.addEventListener('input', e=>{
  const k=e.target.dataset && e.target.dataset.bind; if(!k) return;
  setPath(S,k,e.target.value);
  if(k==='q') renderView();
  else if((k==='add.newName' || k==='add.draft.title') && S.add){ const b=$('#save-btn'), h=$('#save-hint'); if(b){ b.textContent=saveLabel(); b.disabled=!S.add.draft.title.trim(); } if(h) h.hidden=!!S.add.draft.title.trim(); }
});
document.addEventListener('change', e=>{
  const ch=e.target.dataset && e.target.dataset.change; if(!ch) return;
  if(ch==='move'){ const c=capOf(S.capId), v=e.target.value; if(!c||!v) return;
    write(DB.update('captures', c.id, {folderId:v, updatedAt:now()})).catch(()=>{}); toast(`‘${folderName(v)}’로 옮겼어요`); }
  if(ch==='ai-model' && S.aiDraft){ S.aiDraft.model=e.target.value; if(hasAI()){ AIS.models.gemini=e.target.value; aiSave(); S.test=null; toast('모델을 바꿨어요'); } }
});
$('#file').addEventListener('change', e=>{ const f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return; if(!S.add && !openAdd('capture')) return; setFile(f); });
$('#backup-file').addEventListener('change', e=>{ const f=e.target.files && e.target.files[0]; e.target.value=''; if(f) restore(f); });
document.addEventListener('paste', e=>{
  const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/')); if(!f) return;
  e.preventDefault(); if(!S.add && !openAdd('capture')) return; setFile(f);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(TOUR.on) endTour(); else if(S.move) closeMove(); else if(S.add) closeAdd(); } });
$('#sheet').addEventListener('click', e=>{ if(e.target.id!=='sheet') return; if(S.move) closeMove(); else if(S.add) closeAdd(); });
/* long press (or right click) on a capture → move it to another folder */
let lp=null, lpFired=false;
document.addEventListener('pointerdown', e=>{
  const row=e.target.closest('.row[data-act="open"]'); if(!row || (e.pointerType==='mouse' && e.button!==0)) return;
  lpFired=false; if(lp) clearTimeout(lp.t);
  lp={x:e.clientX, y:e.clientY, t:setTimeout(()=>{ lpFired=true; lp=null; try{ navigator.vibrate && navigator.vibrate(12); }catch(_){} openMove([row.dataset.id]); }, 480)};
});
document.addEventListener('pointermove', e=>{ if(lp && (Math.abs(e.clientX-lp.x)>10 || Math.abs(e.clientY-lp.y)>10)){ clearTimeout(lp.t); lp=null; } });
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t, ()=>{ if(lp){ clearTimeout(lp.t); lp=null; } if(lpFired) setTimeout(()=>{ lpFired=false; }, 400); }));
document.addEventListener('click', e=>{ if(lpFired){ lpFired=false; e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('contextmenu', e=>{ const row=e.target.closest('.row[data-act="open"]'); if(!row) return; e.preventDefault(); if(!S.move) openMove([row.dataset.id]); });
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if(e.touches && e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ============ boot: opening screen → app (no login required) ============ */
let booted=false; const bootStart=Date.now();
function bootDone(){
  if(booted) return; booted=true; S.ready=true;
  const left=Math.max(0, 1300-(Date.now()-bootStart));
  setTimeout(()=>{ const sp=$('#splash'); sp.classList.add('out'); setTimeout(()=>{ sp.remove(); if(!LS.get('cc_tour_done')) startTour(); }, 420); }, left);
}
(async function boot(){
  try{ await LocalDB.init(); }catch(e){ S.dataErr='other'; }
  const wasCloud = LS.get('cc_was_cloud')==='1';
  if(!wasCloud){ attach(LocalDB); await aiLoad(); renderView(); bootDone(); }
  try{
    await loadFirebase();
    FB.A.onAuthStateChanged(FB.auth, u=>{ onUser(u); });
  }catch(e){
    if(wasCloud){ LS.del('cc_was_cloud'); attach(LocalDB); await aiLoad(); renderView(); bootDone(); toast('인터넷에 연결되지 않아 이 기기 보관함을 열었어요'); }
  }
  setTimeout(()=>{ if(!booted){ attach(LocalDB); aiLoad().then(()=>{ renderView(); bootDone(); }); } }, 6000);
})();
})();
</script>
